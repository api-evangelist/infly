aid: infly
name: INF Tech
description: >-
  INF Tech (无限光年, "Infinite Light Year") is an AI-native technology company
  headquartered in Shanghai, with a global entity in Singapore (inf.sg), building
  safe and trustworthy agentic AI for mission-critical industries. Its flagship is
  an enterprise "Agentic OS" — an intelligent-agent operating system with unified
  governance, a private AI code-execution engine that supports custom LLMs and
  skills, and full-stack application security spanning model training through
  deployment. INF also develops and open-sources multimodal foundation models,
  including the Infinity-Parser document-parsing family, the INF-Retriever bilingual
  dense-retrieval models, OpenCoder code LLMs, and VL-Rethinker vision-language
  reasoning models, all published on Hugging Face and GitHub. Vertical "industry
  agents" target finance (AI index customization, compliance intelligence,
  investment research, and SME credit rating) alongside science and education.
  The company exposes API, CLI, and SDK access and supports MCP integration.
